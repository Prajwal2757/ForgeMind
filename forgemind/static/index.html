<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>ForgeMind</title>
<link rel="stylesheet" href="/style.css">
<script src="/app.js" defer></script>
</head>
<body>
<h1>Forge<span>Mind</span></h1>
<small>Answers from your documents, with sources.</small>
<p id="message" role="status"></p>

<form id="login">
  <h2>Sign in</h2>
  <input id="tenant" type="text" placeholder="Organisation (tenant)" autocomplete="organization" required>
  <input id="user" type="text" placeholder="User" autocomplete="username" required>
  <input id="password" type="password" placeholder="Password" autocomplete="current-password" required>
  <button type="submit">Sign in</button>
</form>

<main id="app" hidden>
  <p><span id="who"></span> <button id="logout" type="button">Sign out</button></p>
  <h2>Ask</h2>
  <textarea id="q" rows="3" maxlength="2000" aria-label="Question" placeholder="How many days of annual leave do I get?"></textarea>
  <button id="ask" type="button">Ask</button>
  <div id="out"></div>

  <h2>Documents</h2>
  <div id="uploader">
    <input id="file" type="file" accept=".txt,.md,.pdf,.docx" aria-label="File">
    <input id="groups" type="text" placeholder="Restrict to groups (comma separated, blank = whole organisation)">
    <button id="upload" type="button">Upload</button>
  </div>
  <ul id="docs"></ul>

  <details>
    <summary>Change password</summary>
    <input id="current" type="password" placeholder="Current password" autocomplete="current-password">
    <input id="new" type="password" placeholder="New password (12+ characters)" autocomplete="new-password">
    <button id="change" type="button">Change password</button>
  </details>
</main>
</body>
</html>
