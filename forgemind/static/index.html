<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>ForgeMind</title>
<style>
  :root{color-scheme:light dark;--line:#8884;--accent:#c2561c}
  body{font:15px/1.5 system-ui,sans-serif;max-width:760px;margin:0 auto;padding:24px 16px}
  h1{margin:0}h1 span{color:var(--accent)}h2{font-size:16px;margin-top:28px}
  input,textarea,button{font:inherit;padding:8px;border:1px solid var(--line);border-radius:6px;box-sizing:border-box}
  input[type=password],input[type=text],textarea{width:100%;margin-bottom:8px}
  button{cursor:pointer;background:var(--accent);color:#fff;border:0}
  .card{border:1px solid var(--line);border-radius:8px;padding:12px;margin-top:12px;white-space:pre-wrap}
  li button{margin-left:8px;padding:2px 8px}small{opacity:.7}
</style>
</head>
<body>
<h1>Forge<span>Mind</span></h1>
<small>Answers from your documents, with sources.</small>
<h2>Access token</h2>
<input id="token" type="password" placeholder="Paste a token from: python -m forgemind token ...">
<h2>Ask</h2>
<textarea id="q" rows="3" placeholder="How many days of annual leave do I get?"></textarea>
<button id="ask">Ask</button>
<div id="out"></div>
<h2>Documents</h2>
<input id="file" type="file" accept=".txt,.md,.pdf,.docx">
<input id="groups" type="text" placeholder="Restrict to groups (comma separated, blank = whole tenant)">
<button id="upload">Upload</button> <button id="refresh">Refresh list</button>
<ul id="docs"></ul>
<script>
const $ = id => document.getElementById(id);
// All server text is inserted with textContent, never as HTML.
const el = (tag, text, cls) => { const e = document.createElement(tag); e.textContent = text; if (cls) e.className = cls; return e; };
async function api(path, opts = {}) {
  const res = await fetch(path, {...opts, headers: {Authorization: "Bearer " + $("token").value.trim()}});
  const data = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(data.error || res.statusText);
  return data;
}
const guard = fn => async () => { try { await fn(); } catch (e) { alert(e.message); } };
async function refresh() {
  const {documents} = await api("/api/documents");
  $("docs").replaceChildren(...documents.map(d => {
    const li = el("li", d.title + (d.groups.length ? " [" + d.groups.join(", ") + "]" : ""));
    const b = el("button", "Delete");
    b.onclick = guard(async () => { await api("/api/documents/" + d.id, {method: "DELETE"}); await refresh(); });
    li.append(b); return li;
  }));
}
$("ask").onclick = guard(async () => {
  $("out").replaceChildren(el("div", "Thinking…", "card"));
  try {
    const r = await api("/api/ask", {method: "POST", body: JSON.stringify({question: $("q").value})});
    const nodes = [el("div", r.answer, "card")];
    r.sources.forEach(s => nodes.push(el("div", `[${s.n}] ${s.title}\n${s.snippet}`, "card")));
    const d = document.createElement("details");
    d.append(el("summary", "Agent trace"), el("div", r.trace.map(t => JSON.stringify(t)).join("\n"), "card"));
    $("out").replaceChildren(...nodes, d);
  } catch (e) { $("out").replaceChildren(); throw e; }
});
$("upload").onclick = guard(async () => {
  const f = $("file").files[0];
  if (!f) throw new Error("Choose a file first");
  const qs = new URLSearchParams({filename: f.name, groups: $("groups").value});
  await api("/api/documents?" + qs, {method: "POST", body: f});
  await refresh();
});
$("refresh").onclick = guard(refresh);
</script>
</body>
</html>
